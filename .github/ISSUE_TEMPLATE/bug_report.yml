name: Bug report / 错误报告
description: Report a reproducible SUNDOWNER issue.
title: "[BUG] "
labels: ["bug"]
body:
  - type: checkboxes
    id: self_check
    attributes:
      label: Self-check / 自查
      options:
        - label: I have searched existing issues and did not find a duplicate. / 我已经搜索过现有 issue，没有找到重复问题。
          required: true
        - label: I am using the latest source from this repository. / 我使用的是本仓库的最新代码。
          required: true
        - label: I removed secrets, tokens, cookies, and private media from this report. / 我已移除密钥、token、cookie 和私人媒体信息。
          required: true
  - type: textarea
    id: description
    attributes:
      label: What happened? / 发生了什么？
      description: Describe the visible behavior and the affected page, route, or API.
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior / 预期行为
      description: What should SUNDOWNER have done instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps / 复现步骤
      description: List the smallest steps that reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment / 环境
      description: Browser, deployment target, storage backend, and relevant binding names.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots / 日志或截图
      description: Paste safe logs or screenshots. Do not include private credentials or media.
    validations:
      required: false
