name: Feature request / 功能请求
description: Suggest a focused improvement for SUNDOWNER.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirm / 确认
      options:
        - label: I have searched existing issues and did not find the same request. / 我已经搜索过现有 issue，没有找到相同请求。
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem / 问题
      description: What workflow is currently painful or missing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / 期望行为
      description: Describe the smallest useful version of the feature.
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Notes or trade-offs / 补充与取舍
      description: Mention security, storage, privacy, or migration constraints if relevant.
    validations:
      required: false
