name: Help wanted / 使用求助
description: Ask for help with setup, deployment, storage, or migration.
title: "[Help] "
labels: ["help wanted"]
body:
  - type: checkboxes
    id: self_check
    attributes:
      label: Self-check / 自查
      options:
        - label: I have read the README and checked my local configuration. / 我已经阅读 README 并检查本地配置。
          required: true
        - label: I removed secrets, tokens, cookies, and private media from this request. / 我已移除密钥、token、cookie 和私人媒体信息。
          required: true
  - type: textarea
    id: question
    attributes:
      label: Question / 问题
      description: What are you trying to do, and where are you stuck?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context / 背景
      description: Deployment target, command, storage backend, and relevant error output.
    validations:
      required: true
  - type: textarea
    id: attempts
    attributes:
      label: What you tried / 已尝试操作
      description: List the commands or configuration changes already tested.
    validations:
      required: false
